<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Quiz Studio - Local-First Study Desk &amp; Open Teaching Interchange</title>
  <desc id="hero-desc">Quiz Studio combines objective quiz workflows, qualitative translation practice with metacognitive marking, and portable file-based teacher review interchange in a local-first browser application.</desc>

  <defs>
    <!-- Gradients & Filters -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161c"/>
      <stop offset="100%" stop-color="#1a212b"/>
    </linearGradient>

    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f5efe6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="sheetShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="pillShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Desk Surface -->
  <rect width="1200" height="380" rx="16" fill="url(#deskGrad)"/>
  
  <!-- Subtle Desk Grid / Texture -->
  <g stroke="#263140" stroke-width="1" stroke-dasharray="4 8" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="380"/>
    <line x1="620" y1="0" x2="620" y2="380"/>
    <line x1="0" y1="190" x2="1200" y2="190"/>
  </g>

  <!-- LEFT COLUMN: Identity, Positioning & Value -->
  <g transform="translate(56, 46)">
    <!-- Eyebrow Pill -->
    <rect width="210" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4" fill="#60a5fa"/>
    <text x="30" y="18.5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">LOCAL-FIRST STUDY STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">
      Quiz Studio
    </text>

    <!-- Subtitle / Differentiator -->
    <text x="0" y="118" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', serif" font-size="18" font-weight="500">
      Deliberate Practice, Metacognitive Marking &amp; Open Interchange
    </text>

    <!-- Value Statement -->
    <text x="0" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400">
      A zero-backend web studio combining 5-type objective quizzing with
    </text>
    <text x="0" y="174" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5" font-weight="400">
      qualitative translation practice, teacher markup, and portable JSON schema.
    </text>

    <!-- Metadata Badges Row -->
    <g transform="translate(0, 212)">
      <!-- Badge 1: Architecture -->
      <rect width="132" height="28" rx="6" fill="#1e2530" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">100% Client-Side</text>

      <!-- Badge 2: Tech -->
      <rect x="142" width="138" height="28" rx="6" fill="#1e2530" stroke="#334155" stroke-width="1"/>
      <text x="154" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">ESM · Zero Build</text>

      <!-- Badge 3: Audio -->
      <rect x="290" width="126" height="28" rx="6" fill="#1e2530" stroke="#334155" stroke-width="1"/>
      <text x="302" y="18" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11.5" font-weight="600">Web Audio Synth</text>

      <!-- Badge 4: Test Suite -->
      <rect x="426" width="108" height="28" rx="6" fill="#143122" stroke="#22c55e" stroke-width="1"/>
      <text x="438" y="18" fill="#86efac" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700">292 Tests ✓</text>
    </g>

    <!-- Footnote -->
    <text x="0" y="278" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-style="italic">
      No remote account · No database · No paid AI API required · Privacy-first storage
    </text>
  </g>

  <!-- RIGHT COLUMN: Layered Paper Study Sheet Proof Board -->
  <g transform="translate(640, 36)" filter="url(#sheetShadow)">
    <!-- Underlying Paper Sheet Accent (for tactile depth) -->
    <rect x="8" y="8" width="496" height="300" rx="10" fill="#e5dec9" opacity="0.6"/>

    <!-- Primary Laid Paper Sheet -->
    <rect width="496" height="300" rx="10" fill="url(#paperGrad)" stroke="#dcd3c0" stroke-width="1"/>

    <!-- Top Paper Sheet Header (Document Bar) -->
    <g transform="translate(24, 20)">
      <!-- Folder / Document Tag -->
      <rect width="90" height="20" rx="4" fill="#ece5d8"/>
      <text x="8" y="14" fill="#6b5f4d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700">TRANSLATION</text>
      
      <!-- Document Title -->
      <text x="100" y="15" fill="#24201c" font-family="'Charter', 'Georgia', serif" font-size="15" font-weight="700">
        Unit 4 · Advanced Rhetoric
      </text>

      <!-- Item Index Pill -->
      <rect x="380" y="-2" width="68" height="22" rx="11" fill="#1d5bd8"/>
      <text x="394" y="13" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Item 3 / 8</text>
    </g>

    <!-- Hairline Rule -->
    <line x1="24" y1="52" x2="472" y2="52" stroke="#e6dfd1" stroke-width="1"/>

    <!-- Source Prompt -->
    <g transform="translate(24, 72)">
      <text x="0" y="0" fill="#736b5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em">SOURCE MANUSCRIPT</text>
      <text x="0" y="22" fill="#1c1917" font-family="'Charter', 'Georgia', serif" font-size="14.5" font-style="italic">
        "Simplicity is the prerequisite for reliability."
      </text>
    </g>

    <!-- Learner Answer Box with Metacognitive Markings -->
    <g transform="translate(24, 126)">
      <rect width="448" height="66" rx="6" fill="#ffffff" stroke="#d5ccb8" stroke-width="1.2"/>
      
      <text x="14" y="24" fill="#1b3864" font-family="'Charter', 'Georgia', serif" font-size="14" font-weight="500">
        清晰简单 是实现
      </text>
      
      <!-- Marked Span (Uncertain - Amber Highlight) -->
      <rect x="110" y="10" width="70" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="115" y="24" fill="#92400e" font-family="'Charter', 'Georgia', serif" font-size="14" font-weight="600">高度可靠性</text>
      
      <text x="186" y="24" fill="#1b3864" font-family="'Charter', 'Georgia', serif" font-size="14" font-weight="500">
        的必要先决条件。
      </text>

      <!-- Metacognitive Tag Indicator -->
      <g transform="translate(14, 40)">
        <circle cx="4" cy="6" r="3" fill="#f59e0b"/>
        <text x="12" y="10" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600">Uncertain Span Mark: confidence self-assessment saved in response</text>
      </g>
    </g>

    <!-- Teacher Marking Desk Preview Strip -->
    <g transform="translate(24, 206)">
      <rect width="448" height="74" rx="6" fill="#f4efe4" stroke="#dcd3c0" stroke-width="1"/>
      
      <text x="12" y="18" fill="#574d3f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">
        TEACHER MARKING DESK · RICH CORRECTION
      </text>

      <!-- Live Projection Text with Correction -->
      <text x="12" y="42" fill="#1b3864" font-family="'Charter', 'Georgia', serif" font-size="13">
        清晰简单 是实现 
      </text>
      <!-- Strikeout Vermilion Text -->
      <text x="112" y="42" fill="#b91c1c" font-family="'Charter', 'Georgia', serif" font-size="13" text-decoration="line-through">
        高度可靠性
      </text>
      <!-- Inserted Scholar Green Text -->
      <text x="180" y="42" fill="#15803d" font-family="'Charter', 'Georgia', serif" font-size="13" font-weight="700">
        [ 可靠性 ]
      </text>
      <text x="234" y="42" fill="#1b3864" font-family="'Charter', 'Georgia', serif" font-size="13">
        的必要先决条件。
      </text>

      <!-- Stamp Badge -->
      <g transform="translate(360, 16)">
        <rect width="76" height="24" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" transform="rotate(-3 38 12)"/>
        <text x="38" y="16" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle" transform="rotate(-3 38 12)">CORRECTED</text>
      </g>

      <text x="12" y="62" fill="#736b5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5">
        Reviewer Note: Concise wording accurately mirrors the original philosophical aphorism.
      </text>
    </g>
  </g>
</svg>
