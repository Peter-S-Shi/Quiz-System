<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="cap-title cap-desc">
  <title id="cap-title">Quiz Studio Core Capabilities</title>
  <desc id="cap-desc">Three primary learning surfaces: Objective Quiz Desk, Translation Practice Studio, and Teacher Marking Desk.</desc>

  <defs>
    <linearGradient id="capDeskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161f"/>
      <stop offset="100%" stop-color="#1a222e"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="14" fill="url(#capDeskGrad)"/>

  <!-- Column 1: Objective Quiz Desk -->
  <g transform="translate(44, 32)" filter="url(#boxShadow)">
    <rect width="348" height="296" rx="10" fill="#1b2330" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Top Accent Bar -->
    <rect width="348" height="4" rx="2" fill="#3b82f6"/>
    
    <!-- Icon & Title -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="18" y="24" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">📝</text>
      
      <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Objective Quiz Desk</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">5 Question Types &amp; Media Attachments</text>
    </g>

    <!-- Content Items -->
    <g transform="translate(20, 92)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
      <text x="0" y="0"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Single, Multiple, Fill-blank, T/F, Matching</text>
      <text x="0" y="26"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Image &amp; Audio Attachments (IndexedDB Blobs)</text>
      <text x="0" y="52"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Instant Feedback or Submit-at-End modes</text>
      <text x="0" y="78"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Shuffled options &amp; Active session recovery</text>
      <text x="0" y="104"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Wrong-question retry &amp; Score summaries</text>
      <text x="0" y="130"><tspan fill="#60a5fa" font-weight="bold">✓</tspan> Category collections &amp; 3-level progressive nav</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(20, 252)">
      <rect width="180" height="24" rx="4" fill="#1e293b"/>
      <text x="10" y="16" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">Automated Objective Grading</text>
    </g>
  </g>

  <!-- Column 2: Translation Practice Studio -->
  <g transform="translate(426, 32)" filter="url(#boxShadow)">
    <rect width="348" height="296" rx="10" fill="#1b2330" stroke="#f59e0b" stroke-width="1.2"/>
    
    <!-- Top Accent Bar -->
    <rect width="348" height="4" rx="2" fill="#f59e0b"/>

    <!-- Icon & Title -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
      <text x="18" y="24" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">🌐</text>
      
      <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Translation Studio</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Metacognitive Confidence Marking</text>
    </g>

    <!-- Content Items -->
    <g transform="translate(20, 92)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
      <text x="0" y="0"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Sentence-level qualitative translation practice</text>
      <text x="0" y="26"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Hidden-by-default reference translation reveals</text>
      <text x="0" y="52"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Span marks: Unknown / Uncertain / Should know</text>
      <text x="0" y="78"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Metacognitive signals preserved in JSON</text>
      <text x="0" y="104"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Batch import: Source-only &amp; Bilingual TSV</text>
      <text x="0" y="130"><tspan fill="#fbbf24" font-weight="bold">✓</tspan> Protected immutable Learner Response snapshots</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(20, 252)">
      <rect width="176" height="24" rx="4" fill="#1e293b"/>
      <text x="10" y="16" fill="#fcd34d" font-family="ui-monospace, monospace" font-size="11">Qualitative Learning Evidence</text>
    </g>
  </g>

  <!-- Column 3: Teacher Marking Desk & Interchange -->
  <g transform="translate(808, 32)" filter="url(#boxShadow)">
    <rect width="348" height="296" rx="10" fill="#1b2330" stroke="#10b981" stroke-width="1.2"/>
    
    <!-- Top Accent Bar -->
    <rect width="348" height="4" rx="2" fill="#10b981"/>

    <!-- Icon & Title -->
    <g transform="translate(20, 24)">
      <rect width="36" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="18" y="24" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">✒️</text>
      
      <text x="48" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Teacher Marking &amp; Loop</text>
      <text x="48" y="42" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Rich Markup &amp; Lineage Retry</text>
    </g>

    <!-- Content Items -->
    <g transform="translate(20, 92)" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5">
      <text x="0" y="0"><tspan fill="#34d399" font-weight="bold">✓</tspan> Rich Correction: Insert, Replace, Strikeout Inks</text>
      <text x="0" y="26"><tspan fill="#34d399" font-weight="bold">✓</tspan> Rubber stamp judgments &amp; item-level comments</text>
      <text x="0" y="52"><tspan fill="#34d399" font-weight="bold">✓</tspan> Multiple teacher reviews per learner response</text>
      <text x="0" y="78"><tspan fill="#34d399" font-weight="bold">✓</tspan> File round-trip: review-request &amp; remediation</text>
      <text x="0" y="104"><tspan fill="#34d399" font-weight="bold">✓</tspan> Retry entire / selected / needs-work items</text>
      <text x="0" y="130"><tspan fill="#34d399" font-weight="bold">✓</tspan> Lineage navigation surviving document deletion</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(20, 252)">
      <rect width="180" height="24" rx="4" fill="#1e293b"/>
      <text x="10" y="16" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11">Open Interchange &amp; Lineage</text>
    </g>
  </g>
</svg>
