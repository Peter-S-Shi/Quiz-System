[package]
name = "qs-desktop"
description = "Quiz Studio V2 desktop shell (Tauri 2 + WebView2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "qs_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "quiz-studio"
path = "src/main.rs"

[features]
# Embed the frontend assets (set by `cargo tauri build`; use it for plain `cargo build` runs too).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
qs-platform.workspace = true
qs-store.workspace = true
qs-media.workspace = true
qs-activation.workspace = true
qs-archive.workspace = true
qs-port.workspace = true
serde.workspace = true
serde_json.workspace = true
