<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>product-starting</title>
  <link rel="stylesheet" href="../web/styles.css">
  <link rel="stylesheet" href="../web/product.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Primary">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">Q</div>
        <div><b>Quiz Studio</b><span id="brandVersion" class="mono"></span></div>
      </div>
      <nav class="nav" id="nav" aria-label="Views"></nav>
      <h2 class="side-h" id="domainsHead"></h2>
      <div class="domains" id="domains"></div>
      <div class="side-foot">
        <div id="footNav"></div>
        <span class="chip" id="healthChip" role="status">Starting…</span>
      </div>
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="product-harness.js"></script>
</body>
</html>
