name: Desktop (V2)

# Windows build, test and packaging pipeline for the V2 desktop line (ADR 0001 section 10, amendment A2).
# The V1 workflow (ci.yml) is untouched. The authoritative toolchain is MSVC + static CRT on windows-latest.

on:
  push:
    branches: [v2]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    branches: [v2, main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    env:
      CARGO_INCREMENTAL: "0"
      # ADR 0001 acceptance thresholds (locally lower defaults keep the dev loop fast)
      QS_KILLS: "500"
      QS_H3_REPEATS: "3"
      QS_HEAVY_MIB: "400"
      QS_BITFLIPS: "300"
      # ADR 0002 section 16.3 thresholds (V1 migration): randomly timed kills; checkpoint repeats reuse QS_H3_REPEATS
      QS_MIG_KILLS: "200"
      # ADR 0003 section 17 thresholds (Learning Orchestration): randomly timed kills and random operation sequences
      QS_ORCH_KILLS: "100"
      QS_ORCH_SEQUENCES: "60"
      # RC: the TEST-ONLY upgrade source is a real earlier V2 build (the Product Hardening candidate, version 2.0.0-dev.0).
      # It is never the release candidate and is never uploaded as one.
      UPGRADE_SOURCE_REF: "4c0418116c8f948f18ae3a1c9a851c92c92e491b"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Candidate identity (discovered from the authoritative V2 config; the Tauri and Cargo versions must agree)
        id: ident
        run: |
          $tauri = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $tauri -or $tauri -ne $cargo) { throw "version mismatch: tauri.conf.json=$tauri, workspace Cargo.toml=$cargo" }
          $short = "$env:GITHUB_SHA".Substring(0, 7)
          "version=$tauri" >> $env:GITHUB_OUTPUT
          "short=$short" >> $env:GITHUB_OUTPUT
          Write-Host "candidate version $tauri at commit $env:GITHUB_SHA"

      - name: Check out the upgrade-source build (TEST ONLY - an earlier V2 build to prove upgrade preservation, not the candidate)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.UPGRADE_SOURCE_REF }}
          path: upgrade-source
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust toolchain (MSVC)
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt
          rustup default stable-x86_64-pc-windows-msvc
          rustc -vV

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock', 'desktop/rust-toolchain.toml') }}
          restore-keys: desktop-${{ runner.os }}-

      - name: Format and lint
        run: |
          . ./scripts/env.ps1
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Install the locked JS dev dependencies (the adapter differential test compiles the public schema with ajv)
        working-directory: .
        run: npm ci --ignore-scripts

      - name: JS tests (canonical JSON, projections, Store Port client, storage/offline boundary)
        run: node --test "ui/tests/*.spec.mjs"

      - name: V1 migration fixtures are current (generated by V1's own producer, read-only)
        working-directory: .
        run: |
          node desktop/scripts/gen-v1-fixtures.mjs
          git diff --exit-code -- desktop/core/migrate_v1/tests/fixtures

      - name: Generate 5,000 cross-language fidelity vectors
        run: node scripts/gen-canonical-vectors.mjs 5000 "$env:RUNNER_TEMP/canonical-vectors-5000.json" 20261002

      - name: Rust tests (store, media, activation, archive, port + H2/H3/H4/H5 fault and memory suites)
        run: |
          . ./scripts/env.ps1
          $env:QS_VECTORS = "$env:RUNNER_TEMP/canonical-vectors-5000.json"
          cargo test --workspace --exclude qs-desktop -- --nocapture

      - name: Learning Orchestration integration (JS domain against the real Rust store - races, sched-* fault matrix, random kills, archive, 2 to 3 upgrade)
        run: |
          . ./scripts/env.ps1
          cargo build -p qs-scenarios --bin qs-scenario
          node --test "ui/tests/integration/*.spec.mjs"

      - name: Focused Practice DOM self-test (real Chromium engine via Microsoft Edge headless; trusted CDP input - leakage, keyboard, focus, a11y contract, long-text following, committed-text/IME-composition path, resize, resume)
        run: node ui/selftest/practice-selftest.mjs

      - name: Learning-session regression over the real product and store (Library -> runtime -> surface -> SessionFinalizer -> SQLite via qs-scenario port-serve, in headless Edge; restart/resume, retry lineage)
        run: node ui/selftest/app-selftest.mjs

      - name: Final product UI self-test (Today, Calendar, Library + editors, History, Review, Exchange, Settings; cross-page journeys; image/audio; offline; a11y base; Chinese; headless Edge over the real Rust store)
        run: node ui/selftest/product-selftest.mjs

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.1

      - name: Release build + reproducibility of the app binary (A2)
        run: |
          . ./scripts/env.ps1
          cargo build --release -p qs-desktop --features custom-protocol
          $exe = "target/release/quiz-studio.exe"
          $h1 = (Get-FileHash $exe -Algorithm SHA256).Hash
          cargo clean --release -p qs-desktop
          cargo build --release -p qs-desktop --features custom-protocol
          $h2 = (Get-FileHash $exe -Algorithm SHA256).Hash
          "build1=$h1`nbuild2=$h2" | Tee-Object -FilePath "$env:RUNNER_TEMP/repro.txt"
          if ($h1 -ne $h2) { throw "app binary is not reproducible" }

      - name: Shipped binary carries no fault-injection hook
        run: |
          . ./scripts/env.ps1
          $tree = cargo tree -p qs-desktop -e features
          if ($tree -match "fault-injection") { throw "qs-platform/fault-injection is enabled for the app" }
          $bytes = [IO.File]::ReadAllBytes("target/release/quiz-studio.exe")
          $text = [Text.Encoding]::ASCII.GetString($bytes)
          if ($text.Contains("QS_FAULT_AT")) { throw "fault-injection hook found in the release binary" }

      - name: Build the EXACT candidate NSIS installer (version taken from the V2 config, no override)
        run: |
          . ./scripts/env.ps1
          $v = "${{ steps.ident.outputs.version }}"
          Push-Location app/src-tauri
          tauri build --bundles nsis
          Pop-Location
          $built = Get-ChildItem "target/release/bundle/nsis/*_${v}_x64-setup.exe"
          if (-not $built -or $built.Count -ne 1) { throw "expected exactly one installer for $v, found: $($built.Name -join ', ')" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/rc" | Out-Null
          Copy-Item $built.FullName "$env:RUNNER_TEMP/rc/quiz-studio_${v}_x64-setup.exe"
          Get-FileHash "$env:RUNNER_TEMP/rc/quiz-studio_${v}_x64-setup.exe", "target/release/quiz-studio.exe" -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      - name: Build the upgrade-source installer (TEST ONLY - a real earlier V2 build; never the candidate)
        working-directory: upgrade-source/desktop
        run: |
          . ./scripts/env.ps1
          Push-Location app/src-tauri
          tauri build --bundles nsis
          Pop-Location
          $built = Get-ChildItem "target/release/bundle/nsis/*_x64-setup.exe"
          if ($built.Count -ne 1) { throw "expected exactly one upgrade-source installer" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/test-only" | Out-Null
          Copy-Item $built.FullName "$env:RUNNER_TEMP/test-only/upgrade-source_TEST-ONLY_x64-setup.exe"
          Get-FileHash "$env:RUNNER_TEMP/test-only/upgrade-source_TEST-ONLY_x64-setup.exe" -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      - name: Final product UI inside the REAL packaged app (shipped exe, real WebView2 + CSP + Tauri IPC + Rust store; loopback DevTools; reports NOT RUN when the hosted runner WebView2 refuses a debugging port; not the OS IME)
        run: node ui/selftest/packaged-product-check.mjs target/release/quiz-studio.exe

      - name: Installer uses the downloadBootstrapper WebView2 mode (static check)
        run: |
          $nsi = Get-Content "target/release/nsis/x64/installer.nsi" -Raw
          if ($nsi -notmatch 'INSTALLWEBVIEW2MODE "downloadBootstrapper"') { throw "WebView2 install mode is not downloadBootstrapper" }
          if ($nsi -notmatch 'currentUser|perUser|PERUSER') { Write-Host "note: per-user mode is verified at install time (no machine-wide registry key)" }

      - name: Package acceptance of the EXACT candidate (clean install, identity + icon, smoke, upgrade from a real earlier V2 build, backup / restore / V1-migration journeys on the upgraded data, silent uninstall keeps data)
        run: |
          $v = "${{ steps.ident.outputs.version }}"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/evidence" | Out-Null
          ./scripts/package-test.ps1 -Installer "$env:RUNNER_TEMP/rc/quiz-studio_${v}_x64-setup.exe" -ExpectedVersion $v -UpgradeSource "$env:RUNNER_TEMP/test-only/upgrade-source_TEST-ONLY_x64-setup.exe" -IconFile app/src-tauri/icons/icon.ico -DataJourneys -Report "$env:RUNNER_TEMP/evidence/package-report.json" -RealData

      - name: Collect evidence (exact commit, version, installer and executable SHA-256, icon identity)
        if: always()
        run: |
          $v = "${{ steps.ident.outputs.version }}"
          $ev = "$env:RUNNER_TEMP/evidence"
          New-Item -ItemType Directory -Force $ev | Out-Null
          if (Test-Path "$env:RUNNER_TEMP/repro.txt") { Copy-Item "$env:RUNNER_TEMP/repro.txt" $ev }
          $inst = "$env:RUNNER_TEMP/rc/quiz-studio_${v}_x64-setup.exe"
          $icon = Get-FileHash app/src-tauri/icons/icon.ico -Algorithm SHA256
          $shipped = $null
          if (Test-Path "$ev/package-report.json") { $shipped = (Get-Content "$ev/package-report.json" -Raw | ConvertFrom-Json).checks.'identity.installed_exe_sha256_recorded'.detail }
          $obj = [ordered]@{
            commit = "$env:GITHUB_SHA"; version = $v; ga_target = ($v -replace '-.*$', '')
            run = "$env:GITHUB_RUN_ID"; run_attempt = "$env:GITHUB_RUN_ATTEMPT"
            installer = if (Test-Path $inst) { Split-Path $inst -Leaf } else { $null }
            installer_sha256 = if (Test-Path $inst) { (Get-FileHash $inst -Algorithm SHA256).Hash } else { $null }
            shipped_exe_sha256 = $shipped
            build_tree_exe_sha256 = if (Test-Path target/release/quiz-studio.exe) { (Get-FileHash target/release/quiz-studio.exe -Algorithm SHA256).Hash } else { $null }
            build_tree_exe_note = "the Tauri bundler stamps the bundle type into the shipped exe, so it differs from the build-tree exe; shipped_exe_sha256 is the installed one"
            icon_ico_sha256 = $icon.Hash; icon_source = "docs/design-inputs/Design model/app-icon (Concept A Ink-tail Q; regenerated deterministically by build_icon.py)"
            upgrade_source_commit = "$env:UPGRADE_SOURCE_REF"; upgrade_source_note = "TEST ONLY - an earlier V2 build used to prove upgrade preservation; not the candidate"
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 "$ev/rc-evidence.json"
          Get-Content "$ev/rc-evidence.json"
          rustc -vV | Set-Content "$ev/rustc.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-evidence-${{ steps.ident.outputs.version }}-${{ steps.ident.outputs.short }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30

      - name: Upload the candidate installer (the exact RC artifact; the test-only upgrade source is NOT uploaded)
        uses: actions/upload-artifact@v4
        with:
          name: quiz-studio-${{ steps.ident.outputs.version }}-${{ steps.ident.outputs.short }}-installer
          path: ${{ runner.temp }}/rc/quiz-studio_${{ steps.ident.outputs.version }}_x64-setup.exe
          retention-days: 30
