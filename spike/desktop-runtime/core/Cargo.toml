[package]
name = "spike-core"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# H6: build "v2" of the store schema (adds a column + backfill) and optionally a failing migration
v2 = []
fail_migration = []

[lib]
name = "spike_core"
path = "src/lib.rs"

[[bin]]
name = "spikectl"
path = "src/bin/spikectl.rs"

[dependencies]
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
fastrand = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
