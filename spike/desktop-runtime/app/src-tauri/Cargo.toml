[package]
name = "quiz-studio-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Disposable desktop-runtime spike harness (not product code)"

[features]
v2 = ["spike-core/v2"]
fail_migration = ["spike-core/fail_migration"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
spike-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
png = "0.17"
fastrand = "2"
