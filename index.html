<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d5bd8">
    <title>Quiz Studio</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" id="skipLink" href="#mainContent">跳到主要内容</a>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">QS</span>
          <div>
            <h1>Quiz Studio</h1>
            <p>编辑试卷，马上练习</p>
          </div>
        </div>
        <nav class="mode-tabs" aria-label="主要模式">
          <button class="tab-button" id="homeModeButton" type="button">首页</button>
          <button class="tab-button active" id="editModeButton" type="button">编辑</button>
          <button class="tab-button" id="quizModeButton" type="button">做题</button>
          <button class="tab-button" id="translationModeButton" type="button">翻译练习</button>
        </nav>
        <select class="language-select" id="languageSelect" aria-label="界面语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="icon-button" id="soundToggle" type="button" title="切换物理音效" aria-label="切换物理音效">🔊</button>
        <button class="icon-button" id="themeToggle" type="button" title="切换亮色和暗色背景" aria-label="切换亮色和暗色背景">◐</button>
      </header>

      <main id="mainContent" tabindex="-1">
        <section class="workspace home-workspace hidden" id="homeView">
          <section class="tool-launcher-panel" id="homeLauncherPanel"></section>
        </section>

        <section class="workspace edit-workspace" id="editorView">
          <aside class="side-panel">
            <section class="library-panel" id="libraryPanel"></section>

            <div class="paper-fields">
              <label>
                <span data-label="paper-title">试卷名称</span>
                <input id="paperTitle" type="text" maxlength="80">
              </label>
              <label>
                <span data-label="paper-description">说明</span>
                <textarea id="paperDescription" rows="3" maxlength="240"></textarea>
              </label>
              <label>
                <span data-label="paper-category">分类</span>
                <input id="paperCategory" type="text" maxlength="60">
              </label>
              <label>
                <span data-label="paper-tags">标签</span>
                <input id="paperTags" type="text" maxlength="160">
              </label>
            </div>

            <div class="add-strip">
              <button type="button" data-add-type="single">单选</button>
              <button type="button" data-add-type="multiple">多选</button>
              <button type="button" data-add-type="blank">填空</button>
              <button type="button" data-add-type="truefalse">判断</button>
              <button type="button" data-add-type="matching">匹配</button>
            </div>

            <div class="question-list-header">
              <strong id="questionListTitle">题目</strong>
              <span id="questionCount">0</span>
            </div>
            <div class="question-list" id="questionList"></div>

            <div class="utility-row">
              <button class="secondary-button" id="exportButton" type="button">导出</button>
              <label class="secondary-button file-label">
                <span id="importLabelText">导入</span>
                <input id="importInput" type="file" accept="application/json,.json">
              </label>
            </div>
          </aside>

          <section class="editor-panel">
            <div id="questionEditor"></div>
          </section>
        </section>

        <section class="workspace quiz-workspace hidden" id="quizView">
          <section class="quiz-panel" id="quizPanel"></section>
        </section>

        <section class="workspace edit-workspace hidden" id="translationView">
          <aside class="side-panel" id="translationLibraryPanel"></aside>
          <section class="editor-panel" id="translationDocumentPanel"></section>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
